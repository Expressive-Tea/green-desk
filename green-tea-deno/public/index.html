<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>green-desk · live trading desk</title>
    <style>
      :root {
        --bg: #0d1117; --panel: #161b22; --line: #21262d; --ink: #e6edf3;
        --dim: #8b949e; --up: #3fb950; --down: #f85149; --tea: #4ac68a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: 18px; } h1 span { color: var(--tea); }
      .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; max-width: 980px; }
      @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      .panel h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
      .sym { font-weight: 600; } .px { text-align: right; font-variant-numeric: tabular-nums; }
      .up { color: var(--up); } .down { color: var(--down); }
      label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
      input, select, button { width: 100%; padding: 8px 10px; background: var(--bg); color: var(--ink);
        border: 1px solid var(--line); border-radius: 6px; font: inherit; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button { margin-top: 14px; background: var(--tea); color: #06231a; border: none; font-weight: 700; cursor: pointer; }
      button:hover { filter: brightness(1.08); }
      #fills, #out { margin: 0; max-height: 210px; overflow: auto; font-size: 12px; }
      #fills div { padding: 3px 0; border-bottom: 1px solid var(--line); }
      .err { color: var(--down); } .ok { color: var(--up); }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--down); margin-right: 6px; }
      .dot.on { background: var(--up); }
    </style>
  </head>
  <body>
    <header>
      <h1>🍵 green-<span>desk</span></h1>
      <div class="sub">a live trading desk on <b>green-tea</b> — SSE prices · validated orders · duplex WebSocket fills</div>
    </header>
    <main>
      <section class="panel">
        <h2><span class="dot" id="px-dot"></span>Prices — SSE <code>/api/prices</code></h2>
        <table id="prices">
          <tr data-sym="BTC"><td class="sym">BTC</td><td class="px">—</td></tr>
          <tr data-sym="ETH"><td class="sym">ETH</td><td class="px">—</td></tr>
          <tr data-sym="SOL"><td class="sym">SOL</td><td class="px">—</td></tr>
        </table>
      </section>

      <section class="panel">
        <h2>Place order — POST <code>/api/orders</code></h2>
        <label>x-token (try <code>tok-diego</code>, or a bad one for 422/401)</label>
        <input id="token" value="tok-diego" />
        <div class="row">
          <div><label>symbol</label>
            <select id="symbol"><option>BTC</option><option>ETH</option><option>SOL</option></select></div>
          <div><label>side</label>
            <select id="side"><option>buy</option><option>sell</option></select></div>
        </div>
        <label>qty (negative → 422 validation error)</label>
        <input id="qty" type="number" value="1" step="0.1" />
        <button id="send">Send order</button>
        <pre id="out"></pre>
      </section>

      <section class="panel" style="grid-column: 1 / -1;">
        <h2><span class="dot" id="ws-dot"></span>Live fills — WebSocket <code>/api/desk</code></h2>
        <div id="fills"></div>
      </section>
    </main>

    <script>
      const $ = (s) => document.querySelector(s);
      const money = (n) => n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });

      // ── SSE: public live prices ──────────────────────────────────────────
      const last = {};
      const es = new EventSource('/api/prices');
      es.onopen = () => $('#px-dot').classList.add('on');
      es.onerror = () => $('#px-dot').classList.remove('on');
      es.onmessage = (e) => {
        const t = JSON.parse(e.data);
        const cell = document.querySelector(`tr[data-sym="${t.symbol}"] .px`);
        if (!cell) return;
        cell.textContent = money(t.price);
        cell.className = 'px ' + (t.price >= (last[t.symbol] ?? t.price) ? 'up' : 'down');
        last[t.symbol] = t.price;
      };

      // ── WebSocket: duplex fills (token via query — browsers can't set WS headers) ──
      function connectDesk() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/api/desk?token=${encodeURIComponent($('#token').value)}`);
        ws.onopen = () => { $('#ws-dot').classList.add('on'); ws.send('hello'); };
        ws.onclose = () => { $('#ws-dot').classList.remove('on'); setTimeout(connectDesk, 1500); };
        ws.onmessage = (e) => {
          const f = JSON.parse(e.data);
          const line = document.createElement('div');
          line.className = f.side === 'buy' ? 'ok' : 'err';
          line.textContent = `${new Date(f.at).toLocaleTimeString()}  ${f.side.toUpperCase()} ${f.qty} ${f.symbol} @ ${money(f.price)}`;
          $('#fills').prepend(line);
        };
      }
      connectDesk();

      // ── POST an order (x-token header + validated body) ──────────────────
      $('#send').onclick = async () => {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-token': $('#token').value },
          body: JSON.stringify({ symbol: $('#symbol').value, side: $('#side').value, qty: Number($('#qty').value) }),
        });
        const out = $('#out');
        out.textContent = `${res.status} ${res.statusText}\n` + JSON.stringify(await res.json(), null, 2);
        out.className = res.ok ? 'ok' : 'err';
      };
    </script>
  </body>
</html>
